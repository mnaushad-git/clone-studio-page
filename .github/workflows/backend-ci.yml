name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: terrific_bites_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/terrific_bites_test
      REDIS_URL: redis://localhost:6379/15
      CELERY_BROKER_URL: redis://localhost:6379/14
      CELERY_RESULT_BACKEND: redis://localhost:6379/13
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      TRUSTED_HOSTS: localhost,127.0.0.1,testserver

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: mypy app
        run: mypy app

      - name: mypy scripts
        run: mypy scripts

      - name: pytest (applies migrations to terrific_bites_test itself)
        run: pytest

      - name: Alembic upgrade head
        run: alembic upgrade head

      - name: Catalogue seed dry-run
        run: python -m app.scripts.seed_catalogue --dry-run

      - name: Catalogue seed apply
        run: python -m app.scripts.seed_catalogue --apply

      - name: Catalogue seed idempotency check (second apply must be a no-op)
        run: python -m app.scripts.seed_catalogue --apply
