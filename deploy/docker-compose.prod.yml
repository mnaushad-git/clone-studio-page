# Terrific Bites client STAGING stack (terrific-bites.trunexus.ai) on the dedicated VPS. Its
# own Compose project, networks, volumes, PostgreSQL, Redis and staging Odoo. Nothing is
# published except loopback ports for Caddy on the host (and Odoo for an SSH tunnel).
#
# Run from deploy/:  docker compose --env-file .env.prod -f docker-compose.prod.yml <cmd>
# See docs/deployment/production-runbook.md.

name: terrific-bites

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend: &backend
  image: terrific-bites-api:${TB_IMAGE_TAG:?set TB_IMAGE_TAG to the git SHA to run}
  restart: unless-stopped
  logging: *logging
  # Each variable is listed rather than using env_file: .env.prod, which would hand the Odoo
  # master password and the PostgreSQL admin password to every container.
  environment: &backend-env
    APP_ENV: production
    DEBUG: "false"
    # Client staging. Payments and notifications are stubs; paid test orders are pushed to
    # the staging Odoo below and nowhere else (app/core/config.py, _check_staging). The app
    # refuses to start if any of this is changed to point elsewhere.
    DEPLOYMENT_STAGE: staging
    # Hard-coded so that .env.prod cannot switch them. Real payments and real notifications
    # each need an explicit, reviewed change to this file and a different stage.
    ODOO_ORDER_PUSH_PROVIDER: live
    PAYMENT_PROVIDER: stub
    NOTIFICATION_PROVIDER: stub
    DATABASE_URL: postgresql+psycopg://terrific_bites:${POSTGRES_PASSWORD:?}@postgres:5432/terrific_bites
    REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
    CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/1
    CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?}@redis:6379/2
    MEDIA_ROOT: /app/media
    ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?}
    API_PUBLIC_HOST: ${API_PUBLIC_HOST:?}
    TRUSTED_HOSTS: ${TRUSTED_HOSTS:?}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?}
    ADMIN_COOKIE_DOMAIN: ${ADMIN_COOKIE_DOMAIN:?}
    MEDIA_BASE_URL: ${MEDIA_BASE_URL:?}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # The staging Odoo service in this project, fixed here and in code (STAGING_ODOO_*), so
    # that no environment value can redirect staging to another Odoo. Addresses only:
    # credentials go solely to the services below that talk to Odoo.
    ODOO_BASE_URL: http://odoo:8069
    ODOO_DATABASE: terrific_odoo

x-worker-env: &worker-env
  <<: *backend-env
  SERVICE_ROLE: worker
  ODOO_USERNAME: ${ODOO_ORDER_SYNC_LOGIN:-terrific-order-sync}
  ODOO_PASSWORD: ${ODOO_ORDER_SYNC_PASSWORD:?}
  # Approves sale-order writes to the staging Odoo only. The order-sync user can't create
  # products, so this does not allow a catalogue import (see catalogue-import below).
  ODOO_WRITE_APPROVED_TARGET: http://odoo:8069#terrific_odoo

x-odoo: &odoo
  image: odoo:19.0
  logging: *logging
  entrypoint: ["bash", "/etc/terrific/start-odoo.sh"]
  environment: &odoo-env
    ODOO_DB_HOST: postgres
    ODOO_DB_PASSWORD: ${ODOO_DB_PASSWORD:?}
    ODOO_ADMIN_PASSWD: ${ODOO_ADMIN_PASSWD:?}
  volumes:
    - odoo_data:/var/lib/odoo
    - ./odoo/addons:/mnt/terrific-addons:ro
    - ./odoo/odoo.conf.template:/etc/terrific/odoo.conf.template:ro
    - ./odoo/start-odoo.sh:/etc/terrific/start-odoo.sh:ro
    - ./odoo/bootstrap.py:/etc/terrific/bootstrap.py:ro
  networks: [internal]

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: terrific_pgadmin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?}
      POSTGRES_DB: postgres
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:?}
      ODOO_DB_PASSWORD: ${ODOO_DB_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    mem_limit: 1g
    healthcheck:
      # Over TCP: during first-time init the server answers only on its unix socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U terrific_bites -d terrific_bites && pg_isready -h 127.0.0.1 -U terrific_odoo -d terrific_odoo"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    logging: *logging
    # A broker and cache: state is safe to lose and rebuild, so no persistence.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no --maxmemory 128mb --maxmemory-policy noeviction"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    networks: [internal]
    mem_limit: 192m
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: docker compose ... run --rm migrate
  migrate:
    <<: *backend
    restart: "no"
    profiles: [ops]
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *backend-env
      SERVICE_ROLE: migrate
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot, and the only holder of the product-creating Odoo user:
  # docker compose ... run --rm catalogue-import python -m app.scripts.import_odoo_catalogue --plan
  catalogue-import:
    <<: *backend
    restart: "no"
    profiles: [ops]
    command: ["python", "-m", "app.scripts.import_odoo_catalogue", "--validate"]
    environment:
      <<: *backend-env
      SERVICE_ROLE: catalogue_import
      ODOO_USERNAME: ${ODOO_CATALOGUE_IMPORT_LOGIN:-terrific-catalogue-import}
      ODOO_PASSWORD: ${ODOO_CATALOGUE_IMPORT_PASSWORD:?}
      # Blank unless a test-data import into the staging Odoo has been approved; staging
      # refuses any other value.
      ODOO_WRITE_APPROVED_TARGET: ${ODOO_WRITE_APPROVED_TARGET:-}
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    environment:
      <<: *backend-env
      SERVICE_ROLE: api
    ports:
      - "127.0.0.1:${API_HOST_PORT:?}:8000"
    volumes:
      - media:/app/media
    networks: [internal, egress]
    mem_limit: 512m
    healthcheck:
      # TRUSTED_HOSTS holds only the public hostname, so the probe has to send it.
      test:
        - CMD
        - python
        - -c
        - |
          import os, urllib.request as u
          r = u.Request("http://127.0.0.1:8000/api/v1/readiness", headers={"Host": os.environ["API_PUBLIC_HOST"]})
          u.urlopen(r, timeout=4)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    <<: *backend
    environment: *worker-env
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    volumes:
      - media:/app/media
    # Internal only: the staging Odoo is the one Odoo it can reach, with no route out.
    networks: [internal]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Exactly one instance: a second would fire every scheduled task twice.
  celery-beat:
    <<: *backend
    environment:
      <<: *backend-env
      SERVICE_ROLE: beat
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    networks: [internal]
    mem_limit: 192m
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    image: terrific-bites-frontend:${TB_IMAGE_TAG:?}
    restart: unless-stopped
    logging: *logging
    environment:
      API_INTERNAL_BASE_URL: http://api:8000
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:?}:3000"
    networks: [internal, egress]
    mem_limit: 384m
    depends_on:
      api:
        condition: service_healthy

  # One-shot: docker compose ... run --rm odoo-init
  odoo-init:
    <<: *odoo
    restart: "no"
    profiles: [ops]
    # Only this one-shot sees the integration passwords, to create the users in bootstrap.py.
    environment:
      <<: *odoo-env
      ODOO_ORDER_SYNC_LOGIN: ${ODOO_ORDER_SYNC_LOGIN:-terrific-order-sync}
      ODOO_ORDER_SYNC_PASSWORD: ${ODOO_ORDER_SYNC_PASSWORD:?}
      ODOO_CATALOGUE_IMPORT_LOGIN: ${ODOO_CATALOGUE_IMPORT_LOGIN:-terrific-catalogue-import}
      ODOO_CATALOGUE_IMPORT_PASSWORD: ${ODOO_CATALOGUE_IMPORT_PASSWORD:?}
    command: ["-i", "sale_management,stock,account,website_sale,terrific_order_sync", "--stop-after-init"]
    depends_on:
      postgres:
        condition: service_healthy

  # Reachable only through an SSH tunnel to the loopback port. Never add a public site for
  # it without a separate decision.
  odoo:
    <<: *odoo
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ODOO_HOST_PORT:?}:8069"
    networks: [internal, egress]
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8069/web/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

networks:
  # No route to the outside world or to any other application on this host.
  internal:
    internal: true
  # Lets the API, frontend and Odoo publish their loopback ports. The worker and catalogue
  # import are deliberately not on it.
  egress:

volumes:
  postgres_data:
  media:
  odoo_data:
