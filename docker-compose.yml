# Local development stack for the Terrific Bites backend (docs/architecture/deployment-topology.md §1).
# The existing frontend is NOT containerized here — run it separately with `bun run dev`,
# pointed at the API via VITE_API_BASE_URL.
#
# Credentials below are local-dev-only defaults (never used in test/production, where
# real values come from a secrets manager per docs/architecture/deployment-topology.md).

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: terrific_bites
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - terrific_bites_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d terrific_bites"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-api:
    build: ./backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/app/app
      - terrific_bites_media:/app/media
    environment:
      APP_ENV: development
      DEBUG: "true"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/terrific_bites
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8080
      TRUSTED_HOSTS: localhost,127.0.0.1
      # Images the catalogue sync pulls from Odoo are written by celery-worker onto
      # the shared terrific_bites_media volume and served here at /media.
      MEDIA_ROOT: /app/media
      MEDIA_BASE_URL: http://localhost:${API_PORT:-8000}/media
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=INFO
    volumes:
      - ./backend/app:/app/app
      - terrific_bites_media:/app/media
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/terrific_bites
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      # Odoo -> PostgreSQL catalogue sync runs here — set ODOO_BASE_URL/DATABASE/
      # USERNAME/PASSWORD (or API_KEY) in your shell/.env for docker compose's
      # ${VAR} substitution to pick up, or override this service in a compose
      # override file, for the sync to actually reach a real Odoo instance. Left
      # unset, the sync connects gracefully-fails every run (see
      # OdooCatalogueSyncService._connect_readonly) rather than erroring the worker.
      ODOO_BASE_URL: ${ODOO_BASE_URL:-}
      ODOO_DATABASE: ${ODOO_DATABASE:-}
      ODOO_USERNAME: ${ODOO_USERNAME:-}
      ODOO_PASSWORD: ${ODOO_PASSWORD:-}
      ODOO_API_KEY: ${ODOO_API_KEY:-}
      MEDIA_ROOT: /app/media
      MEDIA_BASE_URL: http://localhost:${API_PORT:-8000}/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=INFO
    volumes:
      - ./backend/app:/app/app
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/terrific_bites
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  terrific_bites_postgres_data:
  terrific_bites_media:
